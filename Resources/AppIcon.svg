<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Multi Layar app icon: three screen-shaped panes, the back one solid
       blue, the two in front frosted glass. The squircle sits on Apple's
       1024 grid (824 px artwork, 100 px margin for the shadow).
       Rendered to Resources/AppIcon.icns by scripts/make-icon.sh. -->
  <defs>
    <rect id="sq" x="100" y="100" width="824" height="824" rx="185"/>
    <rect id="pB" x="196" y="214" width="440" height="292" rx="44"/>
    <rect id="pM" x="292" y="334" width="440" height="292" rx="44"/>
    <rect id="pF" x="388" y="454" width="440" height="292" rx="44"/>
    <clipPath id="cSq"><use href="#sq"/></clipPath>
    <clipPath id="cM"><use href="#pM"/></clipPath>
    <clipPath id="cF"><use href="#pF"/></clipPath>

    <filter id="lift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="20"/></filter>

    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.7" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <radialGradient id="spec" cx="0.22" cy="0.08" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f7fd"/><stop offset="1" stop-color="#c9d7ee"/></linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5a96ff"/><stop offset="1" stop-color="#1f4fd0"/></linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6fe0ff"/><stop offset="1" stop-color="#2aa6e0"/></linearGradient>
  </defs>

  <use href="#sq" fill="url(#bg)" filter="url(#lift)"/>
  <use href="#sq" fill="url(#sheen)"/>
  <g clip-path="url(#cSq)">
    <use href="#pB" fill="#1b3f8f" opacity="0.22" filter="url(#soft)" transform="translate(0 22)"/>
    <use href="#pB" fill="url(#back)"/>
    <use href="#pB" fill="none" stroke="url(#rim)" stroke-width="5"/>

    <use href="#pM" fill="#1b3f8f" opacity="0.2" filter="url(#soft)" transform="translate(0 22)"/>
    <g clip-path="url(#cM)"><g filter="url(#frost)"><use href="#sq" fill="url(#bg)"/><use href="#pB" fill="url(#back)"/></g></g>
    <use href="#pM" fill="url(#mid)" fill-opacity="0.42"/>
    <use href="#pM" fill="url(#spec)"/>
    <use href="#pM" fill="none" stroke="url(#rim)" stroke-width="5"/>

    <use href="#pF" fill="#1b3f8f" opacity="0.2" filter="url(#soft)" transform="translate(0 22)"/>
    <g clip-path="url(#cF)"><g filter="url(#frost)"><use href="#sq" fill="url(#bg)"/><use href="#pB" fill="url(#back)"/><use href="#pM" fill="url(#mid)" fill-opacity="0.7"/></g></g>
    <use href="#pF" fill="#ffffff" fill-opacity="0.34"/>
    <use href="#pF" fill="url(#spec)"/>
    <use href="#pF" fill="none" stroke="url(#rim)" stroke-width="6"/>
  </g>
  <use href="#sq" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3"/>
</svg>
